snapshots:
  - name: gold_items
    description: "Snapshot of the items table"
    relation: ref('source_gold-items')
    config:
      schema: gold
      database: '{{target.catalog}}'
      unique_key: id
      strategy: timestamp
      updated_at: update_date
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.